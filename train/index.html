<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>福建线动卧 · 2D/3D 空间透视</title>
  <style>
    :root {
      --bg: #1a1f26;
      --panel-bg: rgba(26, 31, 38, 0.75);
      --border: rgba(120, 130, 150, 0.12);
      --txt-main: #d8e0ec;
      --txt-sub: #8a9ba8;
      --accent: #5a86ff;
      --accent-secondary: #7b5cff;
      --shadow-soft: rgba(26, 31, 38, 0.4);
      --highlight-rgb: 255, 255, 255;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--txt-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #scene { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }

    /* ---------- Loading ---------- */
    #loading {
      position: fixed; inset: 0; z-index: 200;
      display: grid; place-items: center;
      background: #1a1f26;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .load-box {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      min-width: 240px;
    }
    #loading .load-tip {
      display: flex; align-items: center; gap: 10px;
      color: #8a9ba8; font-size: 13.5px; letter-spacing: 0.5px;
      min-height: 20px;
    }
    #loading .spinner {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid rgba(120,130,150,0.22);
      border-top-color: #5a86ff;
      animation: spin 0.9s linear infinite;
      flex: 0 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .load-track {
      width: 220px; height: 4px; border-radius: 999px;
      background: rgba(120, 130, 150, 0.14);
      overflow: hidden;
    }
    #loading #loadBar {
      height: 100%; width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #5a86ff, #7aa3ff);
      will-change: width;
      box-shadow: 0 0 8px rgba(90, 134, 255, 0.45);
    }
    #loading .load-pct {
      font-size: 11px; letter-spacing: 0.5px; color: #a8b8cc;
      font-variant-numeric: tabular-nums;
    }

    .hud {
      position: fixed; left: 28px; top: 24px; pointer-events: none; z-index: 10;
    }
    .hud h1 {
      margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.8px;
      color: #d8e0ec;
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    /* ---------- 折叠触发按钮 ---------- */
    .panel-open-btn {
      position: fixed;
      right: 24px;
      top: 24px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--txt-main);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s, border-color 0.2s;
      font-family: inherit;
    }
    .panel-open-btn:hover {
      background: rgba(30, 45, 70, 0.9);
      border-color: rgba(90, 150, 240, 0.45);
    }
    .panel-open-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }
    .panel-open-btn svg { flex: 0 0 auto; opacity: 0.9; }

    /* ---------- 乘客列表面板 ---------- */
    #panel {
      position: fixed; right: 24px; top: 24px; width: 250px; z-index: 11;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 16px 14px;
      max-height: calc(100vh - 180px);
      display: flex; flex-direction: column;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #panel.collapsed {
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px) scale(0.96);
    }

    .panel-head {
      display: flex; align-items: center; gap: 8px;
      padding: 0 4px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px;
    }
    .panel-title {
      flex: 1;
      font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: #aab8c8;
      white-space: nowrap;
    }

    .toggle-wrap {
      display: flex; align-items: center; background: rgba(0,0,0,0.3);
      border-radius: 8px; padding: 2px; border: 1px solid rgba(255,255,255,0.05);
      flex: 0 0 auto;
    }
    .toggle-btn {
      background: transparent; border: none; color: var(--txt-sub);
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; transition: all 0.2s;
      font-family: inherit;
    }
    .toggle-btn.active {
      background: rgba(90, 130, 220, 0.28); color: #e8eff8;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .panel-close-btn {
      width: 26px; height: 26px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.04);
      color: var(--txt-sub);
      cursor: pointer;
      display: grid; place-items: center;
      font-size: 16px; line-height: 1; padding: 0;
      flex: 0 0 auto;
      transition: 0.2s;
      font-family: inherit;
    }
    .panel-close-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

    #list { overflow-y: auto; padding-right: 4px; flex: 1; -webkit-overflow-scrolling: touch; }
    #list::-webkit-scrollbar { width: 4px; }
    #list::-webkit-scrollbar-thumb { background: rgba(120, 170, 240, 0.2); border-radius: 4px; }

    .list-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 11px 9px 20px;
      margin-bottom: 5px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.025);
      border-radius: 9px;
      font-size: 12.5px; cursor: pointer;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      font-family: inherit;
      color: inherit;
      width: 100%;
      pointer-events: none;
      transform: translateX(20px) scale(0.95);
    }
    .list-item:hover { background: rgba(90, 140, 230, 0.07); border-color: rgba(90, 140, 230, 0.18); transform: translateX(0) scale(0.98); }
    .list-item.active { background: rgba(90, 140, 230, 0.14); border-color: rgba(90, 140, 230, 0.35); box-shadow: 0 3px 12px rgba(0,0,0,0.18); }
    .list-item .indicator { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 8px currentColor; }
    .list-item .nm { font-weight: 550; color: #c8d8e8; }
    .list-item .ps { margin-left: auto; color: var(--txt-sub); font-size: 10.5px; font-weight: 500; white-space: nowrap; }

    #legend {
      position: fixed; left: 28px; bottom: 28px; z-index: 12;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 20px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      font-size: 13px; line-height: 1.5; color: var(--txt-main);
      max-width: 320px; pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    #legend .lg-title { color: #b0c8e8; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase;}

    #card {
      position: fixed; right: 24px; bottom: 24px; width: 250px; z-index: 11;
      background: rgba(16, 23, 38, 0.92);
      border: 1px solid rgba(90, 140, 210, 0.3);
      border-radius: 16px; padding: 18px;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      opacity: 0; transform: translateY(20px); pointer-events: none;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }
    #card.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #card .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-right: 22px; }
    #card .indicator { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 15px currentColor; }
    #card .card-name { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: #fff; word-break: break-all; }
    #card .card-meta { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 12px; }
    #card .card-note {
      font-size: 13px; line-height: 1.6; color: #c6d6ea;
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid rgba(90, 140, 210, 0.6);
      border-radius: 0 8px 8px 0;
      padding: 10px 12px;
      word-break: break-word;
    }
    #card .card-close {
      position: absolute; right: 12px; top: 12px; width: 24px; height: 24px;
      border-radius: 6px; border: none; background: rgba(255, 255, 255, 0.06);
      color: #8fb8e8; cursor: pointer; font-size: 12px;
      display: grid; place-items: center; transition: 0.2s;
      font-family: inherit;
    }
    #card .card-close:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    /* ---------- 3D 悬浮标签 ---------- */
    .bunk-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
      padding: 3px 9px; border-radius: 6px; white-space: nowrap;
      background: rgba(24, 29, 37, 0.88);
      border: 1px solid rgba(255,255,255,0.14);
      color: #e6edf6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: background 0.18s, border-color 0.18s, box-shadow 0.18s, opacity 0.25s, color 0.18s;
      position: relative;
    }
    .bunk-label::after {
      content: '';
      position: absolute; left: 0; top: 50%;
      width: 3px; height: 60%;
      transform: translateY(-50%);
      border-radius: 0 2px 2px 0;
      background: var(--pc, #5a86ff);
      opacity: 0.85;
    }
    @media (max-width: 820px) {
      .bunk-label {
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }
    }
    .bunk-label:hover {
      background: rgba(34, 41, 52, 0.96);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 4px 14px rgba(0,0,0,0.55);
    }
    .bunk-label.is-active {
      background: rgba(40, 48, 62, 0.98);
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      z-index: 100;
    }
    .bunk-label.is-active:hover {
      transform: none;
    }

    /* ---------- 2D 标签 ---------- */
    body.mode-2d .bunk-label {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #e8f0f8;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      opacity: 1;
      white-space: nowrap;
    }
    body.mode-2d .bunk-label::before { display: none; }
    body.mode-2d .bunk-label { pointer-events: none; }
    body.mode-2d .bunk-label:hover { background: rgba(255,255,255,0.08); color: #fff; opacity: 1; }
    body.mode-2d .bunk-label.is-active {
      background: rgba(255,255,255,0.12); border: none; box-shadow: none; color: #fff; opacity: 1;
      text-shadow: 0 0 6px rgba(255,255,255,0.4), 0 1px 3px rgba(0,0,0,0.5);
    }

    .car-label {
      font-size: 14px; font-weight: 800; letter-spacing: 4px;
      color: #7eb2f0;
      padding: 6px 18px; border-radius: 999px;
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid rgba(90, 140, 210, 0.3);
      white-space: nowrap; pointer-events: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: opacity 0.25s;
    }
    body.mode-2d .car-label {
      background: transparent; border: none; box-shadow: none;
      font-size: 12px; letter-spacing: 3px; color: #6fa8e8;
    }

    /* ---------- 移动端适配 ---------- */
    @media (max-width: 820px) {
      .hud { left: 16px; top: 16px; max-width: calc(100% - 140px); }
      .hud h1 { font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .panel-open-btn {
        right: 16px; top: 16px;
        padding: 8px 12px;
        font-size: 12px;
      }

      #panel {
        left: 16px; right: 16px;
        width: auto;
        top: auto; bottom: 16px;
        max-height: 48vh;
        border-radius: 16px;
      }
      #panel.collapsed {
        transform: translateY(24px) scale(0.96);
      }
      .panel-title { font-size: 11px; letter-spacing: 1px; }
      .panel-close-btn { width: 24px; height: 24px; font-size: 14px; }

      #legend { display: none; }

      #card {
        left: 16px; right: 16px;
        width: auto;
        bottom: 16px;
        max-height: 45vh;
      }

      body.mode-2d .bunk-label { font-size: 8px; letter-spacing: 0; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="load-box">
    <div class="load-tip"><span class="spinner"></span><span id="loadText">正在加载 3D 场景…</span></div>
    <div class="load-track"><div id="loadBar"></div></div>
    <div class="load-pct" id="loadPct">0%</div>
  </div>
</div>

<div id="scene"></div>

<div class="hud">
  <h1>福建线去程部分同学位置</h1>
</div>

<button id="panelOpenBtn" class="panel-open-btn" aria-label="打开乘客列表">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="6" x2="21" y2="6"></line>
    <line x1="8" y1="12" x2="21" y2="12"></line>
    <line x1="8" y1="18" x2="21" y2="18"></line>
    <line x1="3.5" y1="6" x2="3.51" y2="6"></line>
    <line x1="3.5" y1="12" x2="3.51" y2="12"></line>
    <line x1="3.5" y1="18" x2="3.51" y2="18"></line>
  </svg>
  <span>乘客列表</span>
</button>

<aside id="panel" class="collapsed">
  <div class="panel-head">
    <span class="panel-title">乘 客 列 表</span>
    <div class="toggle-wrap">
      <button class="toggle-btn active" id="btn3D">3D</button>
      <button class="toggle-btn" id="btn2D">2D</button>
    </div>
    <button id="panelCloseBtn" class="panel-close-btn" aria-label="收起乘客列表">×</button>
  </div>
  <div id="list"></div>
</aside>

<div id="card"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script>
  window.addEventListener('error', () => {
    var t = document.getElementById('loadText');
    var l = document.getElementById('loading');
    if (t && l && !l.classList.contains('hidden')) {
      t.textContent = '资源加载失败，请检查网络后刷新页面';
    }
  }, true);
  setTimeout(function () {
    var t = document.getElementById('loadText');
    var l = document.getElementById('loading');
    if (t && l && !l.classList.contains('hidden')) {
      t.textContent = '加载较慢，请检查网络连接…';
    }
  }, 8000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* =========================================================
   0. 加载进度系统
   ========================================================= */
const loadingEl = document.getElementById('loading');
const loadBarEl = document.getElementById('loadBar');
const loadPctEl = document.getElementById('loadPct');
const loadTextEl = document.getElementById('loadText');

let loadTargetPct = 0;
let loadDisplayPct = 0;
let loadSmoothRunning = false;

function applyLoadUI() {
  if (loadBarEl) loadBarEl.style.width = loadDisplayPct.toFixed(2) + '%';
  if (loadPctEl) loadPctEl.textContent = Math.round(loadDisplayPct) + '%';
}

function stepLoadSmooth() {
  const diff = loadTargetPct - loadDisplayPct;
  if (diff <= 0.05) {
    loadDisplayPct = loadTargetPct;
    applyLoadUI();
    loadSmoothRunning = false;
    return;
  }
  const step = Math.max(diff * 0.14, 0.15);
  loadDisplayPct = Math.min(loadTargetPct, loadDisplayPct + step);
  applyLoadUI();
  requestAnimationFrame(stepLoadSmooth);
}

function setLoadProgress(pct, text) {
  const v = Math.max(0, Math.min(100, pct));
  if (v > loadTargetPct) loadTargetPct = v;
  if (text && loadTextEl) loadTextEl.textContent = text;
  if (!loadSmoothRunning) {
    loadSmoothRunning = true;
    requestAnimationFrame(stepLoadSmooth);
  }
}

function nextFrame() {
  return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

setLoadProgress(5, '正在初始化渲染引擎…');
await nextFrame();

/* =========================================================
   1. 乘客数据
   ========================================================= */
const PASSENGERS = [
  { name:'张坤洋', shortName:'张坤洋', car:5, num:19, level:1, color:'#ff5c7a', note:'啥也别说了，你还挺厉害' },
  { name:'许芝仪', shortName:'许芝仪', car:3, num:7,  level:3, color:'#2ee6d6', note:'阿巴阿巴' },
  { name:'明子琪', shortName:'明子琪', car:3, num:11, level:1, color:'#ffd93d', note:'' },
  { name:'胡珈宁', shortName:'胡珈宁', car:5, num:2,  level:1, color:'#a97bff', note:'扎啤黑客我的功绩才写了10000000分之一太可恶了' },
  { name:'薛雯月', shortName:'薛雯月', car:3, num:6,  level:3, color:'#ff8ac4', note:'' },
  { name:'周铭浩', shortName:'周铭浩', car:3, num:8,  level:2, color:'#3ddc97', note:'' },
  { name:'侯佳萱', shortName:'侯佳萱', car:5, num:18, level:3, color:'#4da3ff', note:'' },
  { name:'刘泽凯', shortName:'刘泽凯', car:3, num:8,  level:1, color:'#ffa94d', note:'' },
  { name:'王梓懿', shortName:'王梓懿', car:5, num:13, level:1, color:'#ff7b54', note:'额没事，为什么要发这个问卷？（疑惑）我听说这个位置会改，所以现在的位置还不确定🤪' }
];
const LEVEL_NAMES = { 1: '下铺', 2: '中铺', 3: '上铺' };

/* =========================================================
   2. 物理尺寸参数
   ========================================================= */
const CAR_LEN = 22.0;
const CAR_WIDTH = 3.2;
const CAR_GAP = 4.0;
const CAR_CENTERS = [ -(CAR_LEN+CAR_GAP)/2, (CAR_LEN+CAR_GAP)/2 ];
const CAR_NUMBERS = [3, 5];

const COMP_COUNT = 11;
const COMP_LEN = 2.0;
const WALL_THICK = 0.08;

const X_WINDOW_CENTER = -CAR_WIDTH / 2;
const X_WINDOW_INNER = X_WINDOW_CENTER + WALL_THICK / 2;

const X_DOOR_WALL = CAR_WIDTH / 2 - 1.2;
const X_DOOR_INNER = X_DOOR_WALL - WALL_THICK / 2;
const X_AISLE_WALL = CAR_WIDTH / 2;

const BUNK_LEN_X = X_DOOR_INNER - X_WINDOW_INNER;
const BUNK_WIDTH_Z = 0.7;
const BUNK_CENTER_X = X_WINDOW_INNER + BUNK_LEN_X / 2;

const Z_LEFT_BUNK_CENTER = -COMP_LEN/2 + WALL_THICK/2 + BUNK_WIDTH_Z/2;
const Z_RIGHT_BUNK_CENTER = COMP_LEN/2 - WALL_THICK/2 - BUNK_WIDTH_Z/2;

const LEVEL_Y = { 1: 0.5, 2: 1.3, 3: 2.1 };
const CEIL_Y = 2.6;

/* ---------- 2D 床位块尺寸 ---------- */
const BLOCK_W = 0.76;
const BLOCK_H = 0.55;

/* ---------- 2D 上下并排布局 ---------- */
const STACK_GAP = 2.8;
const STACK_TOTAL_H = 2 * CEIL_Y + STACK_GAP;
const STACK_BASE_Y = [
  -STACK_TOTAL_H / 2,
  -STACK_TOTAL_H / 2 + CEIL_Y + STACK_GAP
];
const SIDE_THETA = Math.PI / 2;
const SIDE_PHI = Math.PI / 2;
const FOV_2D = 18;

function compute2DDistance(aspect) {
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(FOV_2D / 2));
  const neededW = CAR_LEN + 3;
  const neededH = STACK_TOTAL_H + 2.5;
  return Math.max(neededW / (2 * tanHalf * aspect), neededH / (2 * tanHalf));
}
function compute2DEndState(aspect) {
  const D = compute2DDistance(aspect);
  return { target: new THREE.Vector3(0, 0, 0), camPos: new THREE.Vector3(D, 0, 0) };
}

const FOV_3D = 42;
const LABEL_LIFT_3D = 1.05;
const LABEL_LIFT_FOCUS = 0.10;

const LABEL_LIFT_3D_BY_LEVEL = {
  1: CEIL_Y * 1.08,
  2: CEIL_Y * 1.95,
  3: CEIL_Y * 2.85
};
const LABEL_LIFT_SIDE_OFFSET = 0.16;

const LABEL_FAN_OUT_X = 0.24;   /* 水平扇出距离：左右错开防止重叠 */

const SCENE_BOX = {
  minX: -CAR_WIDTH / 2 - 0.5,
  maxX:  CAR_WIDTH / 2 + 0.5,
  minY: -0.4,
  maxY:  LEVEL_Y[3] + 0.35 + CEIL_Y * 2.85 + LABEL_LIFT_SIDE_OFFSET + 0.9,
  minZ: -CAR_LEN - CAR_GAP / 2 - 1.5,
  maxZ:  CAR_LEN + CAR_GAP / 2 + 1.5
};

function compute3DOverviewState(aspect) {
  const dir = new THREE.Vector3(1, 0.9, 1).normalize();
  const cx = (SCENE_BOX.minX + SCENE_BOX.maxX) / 2;
  const cy = (SCENE_BOX.minY + SCENE_BOX.maxY) / 2;
  const cz = (SCENE_BOX.minZ + SCENE_BOX.maxZ) / 2;
  const center = new THREE.Vector3(cx, cy, cz);

  const zAxis = dir.clone();
  const xAxis = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), zAxis).normalize();
  const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();

  const tanV = Math.tan(THREE.MathUtils.degToRad(FOV_3D / 2));
  const tanH = tanV * Math.max(aspect, 0.0001);

  let dist = 0;
  for (const x of [SCENE_BOX.minX, SCENE_BOX.maxX]) {
    for (const y of [SCENE_BOX.minY, SCENE_BOX.maxY]) {
      for (const z of [SCENE_BOX.minZ, SCENE_BOX.maxZ]) {
        const v = new THREE.Vector3(x, y, z).sub(center);
        const a = v.dot(xAxis);
        const b = v.dot(yAxis);
        const c = v.dot(zAxis);
        dist = Math.max(dist, c + Math.abs(a) / tanH, c + Math.abs(b) / tanV);
      }
    }
  }
  dist *= 1.06;
  const camPos = center.clone().add(dir.clone().multiplyScalar(dist));
  return { target: center, camPos, dist };
}

    magFactor = 2.0;

// 自适应缩放灵敏度配置
const ZOOM_SENSITIVITY_CONFIG = {
  baseSpeed: 1.9,               // 基础缩放速度（较默认 1.0 明显增强）
  minSpeed: 1.2,                // 下限
  maxSpeed: 5.5,                // 上限
  refDiagonal: 1900,            // 参考屏幕对角线（像素）
  refDistance: 60               // 参考相机距离
};

/**
 * 计算自适应缩放速度（返回 OrbitControls.zoomSpeed 的值）。
 * 综合考虑：窗口尺寸（越小越灵敏）、相机距离（越远步进越大）、
 * 以及滚轮 deltaY 幅度（区分鼠标滚轮与触控板）。
 * @param {number} magFactor 滚轮幅度系数（触控捏合传 1）
 */
function computeAdaptiveZoomSpeed(magFactor = 1) {
  const cfg = ZOOM_SENSITIVITY_CONFIG;

  // 窗口越小 → 灵敏度越高（移动端补偿）
  const diag = Math.hypot(innerWidth, innerHeight) || cfg.refDiagonal;
  const windowFactor = THREE.MathUtils.clamp(cfg.refDiagonal / diag, 0.85, 2.4);

  // 相机距离越远 → 步进越大，保证远近手感一致
  const dist = camera.position.distanceTo(controls.target);
  const distFactor = THREE.MathUtils.clamp(Math.sqrt(dist / cfg.refDistance), 0.7, 2.6);

  const speed = cfg.baseSpeed * windowFactor * distFactor * magFactor;
  return THREE.MathUtils.clamp(speed, cfg.minSpeed, cfg.maxSpeed);
}

/** 将自适应缩放速度写入 controls（供滚轮 / 中键 / 触摸捏合共用） */
function applyAdaptiveZoomSpeed(magFactor = 1) {
  controls.zoomSpeed = computeAdaptiveZoomSpeed(magFactor);
}

function easeInOutCubic(k) {
  return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
}
function easeInOutQuart(k) {
  return k < 0.5 ? 8 * k * k * k * k : 1 - Math.pow(-2 * k + 2, 4) / 2;
}

const REF_AXIS = new THREE.Vector3(0, 1, 0);

function computeOrbit(offset) {
  const dist = offset.length();
  const dir = dist > 1e-6 ? offset.clone().divideScalar(dist) : new THREE.Vector3(0, 0, 1);
  const quat = new THREE.Quaternion().setFromUnitVectors(REF_AXIS, dir);
  return { dist, dir, quat };
}

      new THREE.SphereGeometry(0.38, 8, 8),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
    );
    hitbox.position.copy(localPos);
    hitbox.userData.index = i;
    hitbox.userData.noHide = true;
    carGroup.add(hitbox);
    markers.push({ mesh: hitbox, type: 'hitbox', data: p });
    passengerHitboxes[i] = hitbox;
    hitboxMeshes.push(hitbox);

    const blockGeo = new THREE.PlaneGeometry(BLOCK_W, BLOCK_H);
    blockGeo.rotateY(Math.PI / 2);
    const blockMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(p.color),
      transparent: true,
      opacity: 0.32,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const blockMesh = new THREE.Mesh(blockGeo, blockMat);
    blockMesh.position.set(BUNK_CENTER_X - 0.02, levelY + 0.05, basePos.z);
    blockMesh.userData.noHide = true;
    blockMesh.userData.index = i;
    blockMesh.visible = false;
    carGroup.add(blockMesh);
    bunk2DMeshes.push(blockMesh);
    clickTargets2D.push(blockMesh);

    const edgeMat = new THREE.LineBasicMaterial({ color: new THREE.Color(p.color), transparent: true, opacity: 0.85 });
    const blockEdges = new THREE.LineSegments(new THREE.EdgesGeometry(blockGeo), edgeMat);
    blockEdges.position.copy(blockMesh.position);
    blockEdges.userData.noHide = true;
    blockEdges.visible = false;
    carGroup.add(blockEdges);
    bunk2DMeshes.push(blockEdges);

    const inCompNum = (p.num - 1) % 6 + 1;
    const isLeftBunk = (inCompNum % 2 !== 0);
    const lift3D = (LABEL_LIFT_3D_BY_LEVEL[p.level] ?? LABEL_LIFT_3D) +
                   (isLeftBunk ? LABEL_LIFT_SIDE_OFFSET : -LABEL_LIFT_SIDE_OFFSET);

    const div = document.createElement('div');
    div.className = 'bunk-label';
    div.textContent = p.shortName;
    div.style.setProperty('--pc', p.color);
    div.addEventListener('click', (e) => {
      e.stopPropagation();
      selectPassenger(i, true);
    });
    div.addEventListener('pointerenter', () => { hovered = i; });
    div.addEventListener('pointerleave', () => { if (hovered === i) hovered = -1; });

    const label = new CSS2DObject(div);
    label.position.copy(basePos);
    label.position.y += lift3D;
    carGroup.add(label);
    markers.push({ mesh: label, type: 'label', data: p });

    const lineMat = new THREE.LineBasicMaterial({
      color: new THREE.Color(p.color),
      transparent: true,
      opacity: 0.5,
      depthWrite: false,
      linewidth: 1
    });

    /* ---- 引导线：锚点 → 折点 → 标签，采用两段式折线（肘形）----
       折点先水平向外（远离走道/车窗中线）再竖直上升，
       使相邻标签在水平方向错开，避免重叠遮挡。 */
    const linePts = [
      basePos.clone(),
      basePos.clone(),
      label.position.clone()
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
    const line = new THREE.Line(lineGeo, lineMat);
    carGroup.add(line);

    /* ---- 锚点小圆点：标示床位真实位置，弱化视觉突兀感 ---- */
    const anchorDot = new THREE.Mesh(
      new THREE.CircleGeometry(0.045, 12),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(p.color),
        transparent: true,
        opacity: 0.9,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    anchorDot.position.copy(basePos);
    anchorDot.userData.noHide = true;
    carGroup.add(anchorDot);

    /* ---- 记录床位侧别（左/右）用于智能连接，复用上方已声明的变量 ---- */
    labelEntries[i] = {
      label, line, lineMat, anchorDot,
      basePos, levelY, lift3D, isLeftBunk,
      /* 水平扇出偏移：窗侧向左、门侧向右，避免同排标签堆叠 */
      fanX: isLeftBunk ? -LABEL_FAN_OUT_X : LABEL_FAN_OUT_X
    };
  }

  const pct = LABEL_PCT_START + (LABEL_PCT_END - LABEL_PCT_START) * ((i + 1) / LABEL_TOTAL);
  setLoadProgress(pct, `正在生成乘客标签… ${i + 1}/${LABEL_TOTAL}`);
  await nextFrame();
}
setLoadProgress(LABEL_PCT_END, '乘客标签生成完成');
await nextFrame();

function updateLabelLayout(i) {
  const e = labelEntries[i];
  if (!e) return;
  const isFocus = (i === selected);
  let ty;
  if (is2DMode) {
    ty = e.levelY + 0.05;
  } else {
    ty = e.basePos.y + (isFocus ? LABEL_LIFT_FOCUS : e.lift3D);
  }
  e.label.position.set(e.basePos.x, ty, e.basePos.z);

  /* ---- 肘形引导线：锚点 → 折点 (水平偏移后) → 标签 ----
     当非聚焦模式时，折点水平向外扇出，使同排标签错开；
     聚焦时恢复垂直对齐。 */
  const bx = e.basePos.x, by = e.basePos.y, bz = e.basePos.z;
  const attr = e.line.geometry.attributes.position;

  if (isFocus || is2DMode) {
    /* 聚焦或 2D 模式：三点共线垂直向上 */
    attr.setXYZ(0, bx, by, bz);
    attr.setXYZ(1, bx, by, bz);
    attr.setXYZ(2, bx, ty, bz);
    e.anchorDot.visible = false;
  } else {
    /* 普通模式：肘形布局，先水平扇出再上升 */
    const elbowX = bx + e.fanX * 0.35;
    attr.setXYZ(0, bx, by, bz);          /* 锚点 */
    attr.setXYZ(1, elbowX, by + 0.18, bz); /* 折点 */
    attr.setXYZ(2, bx, ty, bz);          /* 标签位置 */
    e.anchorDot.visible = true;
  }
  attr.needsUpdate = true;
  e.line.geometry.computeBoundingSphere();

  e.line.visible = !is2DMode && !isFocus;
  e.lineMat.opacity = isFocus ? 0 : 0.48;
}

function updateAllLabelLayouts() {
  PASSENGERS.forEach((_, i) => updateLabelLayout(i));
}

/* =========================================================
   11. 高亮
   ========================================================= */
let highlightedBunk = null;
const tmpColor = new THREE.Color();

function applyHighlight(p) {
  clearHighlight();
  if (!p) return;
  const bunk = passengerBunkMap.get(p);
  if (!bunk) return;
  highlightedBunk = bunk;
  tmpColor.set(p.color);
  bunk.userData.materials.forEach(m => {
    if (m.emissive) {
      m.emissive.copy(tmpColor);
      m.emissiveIntensity = 0.5;
    }
  });
}
function clearHighlight() {
  if (highlightedBunk) {
    highlightedBunk.userData.materials.forEach(m => {
      if (m.emissive) { m.emissive.setHex(0x000000); m.emissiveIntensity = 0; }
    });
  }
  highlightedBunk = null;
}

/* =========================================================
   12. 面板折叠 & 模式切换
   ========================================================= */
const panelEl = document.getElementById('panel');
const panelOpenBtn = document.getElementById('panelOpenBtn');
const panelCloseBtn = document.getElementById('panelCloseBtn');

function setPanelCollapsed(collapsed) {
  panelEl.classList.toggle('collapsed', collapsed);
  panelOpenBtn.classList.toggle('hidden', !collapsed);
}

panelOpenBtn.addEventListener('click', () => setPanelCollapsed(false));
panelCloseBtn.addEventListener('click', () => setPanelCollapsed(true));

addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && selected >= 0) deselect();
});

let is2DMode = false;
let lastBunk2DVisible = false;

const btn3D = document.getElementById('btn3D');
const btn2D = document.getElementById('btn2D');

btn3D.addEventListener('click', () => {
  if (innerWidth <= 820) setPanelCollapsed(true);
  switchMode(false);
});
btn2D.addEventListener('click', () => {
  if (innerWidth <= 820) setPanelCollapsed(true);
  switchMode(true);
});

function compute3DEndState(aspect) {
  return compute3DOverviewState(aspect);
}

function switchMode(to2D) {
  if (is2DMode === to2D || modeTransition) return;

  document.body.classList.toggle('mode-2d', to2D);

  if (selected >= 0) deselect();

  flyTween = null;
  focusTween2D = null;
  clearHighlight();

  const startCamPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const startFov = camera.fov;
  const startCarPositions = carGroups.map(g => g.position.clone());
  const startAisleOpacity = matAisleWall.opacity;
  const startFogDensity = scene.fog.density;

  let endCamPos, endTarget, endFov, endCarPositions, endAisleOpacity, endFogDensity;
  if (to2D) {
    const st = compute2DEndState(innerWidth / innerHeight);
    endTarget = st.target.clone();
    endCamPos = st.camPos.clone();
    endFov = FOV_2D;
    endCarPositions = carGroups.map((g, i) => new THREE.Vector3(0, STACK_BASE_Y[i], 0));
    endAisleOpacity = 0.02;
    endFogDensity = 0.0002;
  } else {
    const st = compute3DEndState(innerWidth / innerHeight);
    endTarget = st.target.clone();
    endCamPos = st.camPos.clone();
    endFov = FOV_3D;
    endCarPositions = carGroups.map((g, i) => new THREE.Vector3(0, 0, CAR_CENTERS[i]));
    endAisleOpacity = 0.22;
    endFogDensity = 0.0012;
  }

  const startOrbit = computeOrbit(startCamPos.clone().sub(startTarget));
  const endOrbit = computeOrbit(endCamPos.clone().sub(endTarget));

  controls.enabled = false;

  modeTransition = {
    t: 0,
    dur: 1400,
    startTarget, endTarget,
    startFov, endFov,
    startDist: startOrbit.dist,
    endDist: endOrbit.dist,
    startQuat: startOrbit.quat.clone(),
    endQuat: endOrbit.quat.clone(),
    startCarPositions, endCarPositions,
    startAisleOpacity, endAisleOpacity,
    startFogDensity, endFogDensity,
    to2D,
    onComplete: () => {
      is2DMode = to2D;
      btn3D.classList.toggle('active', !is2DMode);
      btn2D.classList.toggle('active', is2DMode);

      if (is2DMode) {
        controls.minAzimuthAngle = SIDE_THETA;
        controls.maxAzimuthAngle = SIDE_THETA;
        controls.minPolarAngle = SIDE_PHI;
        controls.maxPolarAngle = SIDE_PHI;
        controls.enableRotate = false;
        controls.mouseButtons = MOUSE_2D;
        controls.touches = TOUCH_2D;
        controls.screenSpacePanning = true;

        const D = camera.position.x - controls.target.x;
        controls.minDistance = Math.max(D * 0.4, 5);
        controls.maxDistance = D * 5;

        camera.position.set(controls.target.x + D, controls.target.y, controls.target.z);
      } else {
        controls.enableRotate = true;
        controls.minAzimuthAngle = -Infinity;
        controls.maxAzimuthAngle = Infinity;
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = Math.PI * 0.495;
        controls.mouseButtons = MOUSE_3D;
        controls.touches = TOUCH_3D;
        controls.minDistance = 4;
        controls.screenSpacePanning = false;

        controls.maxDistance = 500;
      }

      controls.enabled = true;
      controls.update();
      modeTransition = null;

      updateAllLabelLayouts();
      updateBunk2DVisibility();
    }
  };
}

function refreshTransitionEndOrbit() {
  if (!modeTransition) return;

  let st;
  if (modeTransition.to2D) {
    st = compute2DEndState(innerWidth / innerHeight);
  } else {
    st = compute3DEndState(innerWidth / innerHeight);
  }
  modeTransition.endTarget.copy(st.target);
  const endOrbit = computeOrbit(st.camPos.clone().sub(st.target));
  modeTransition.endDist = endOrbit.dist;
  modeTransition.endQuat.copy(endOrbit.quat);
}

function updateBunk2DVisibility() {
  const show = is2DMode;
  if (show === lastBunk2DVisible) return;
  lastBunk2DVisible = show;
  bunk2DMeshes.forEach(o => o.visible = show);
}

/* =========================================================
   13. 聚焦 / 失焦
   ========================================================= */
const cardEl = document.getElementById('card');
const listEl = document.getElementById('list');

function selectPassenger(i, fly) {
  if (modeTransition) return;

  selected = i;
  const p = PASSENGERS[i];

  [...listEl.children].forEach((el, k) => el.classList.toggle('active', k === i));

  // 保存当前视图状态作为预聚焦状态
  preFocusView = {
    target: controls.target.clone(),
    dist: camera.position.distanceTo(controls.target),
    position: camera.position.clone()
  };

  cardEl.innerHTML = `
    <button class="card-close" id="cardClose">✕</button>
    <div class="card-head">
      <span class="indicator" style="background:${p.color}; box-shadow:0 0 15px ${p.color}"></span>
      <span class="card-name">${escapeHtml(p.name)}</span>
    </div>
    <div class="card-meta">${p.car} 号车厢 · ${String(p.num).padStart(2,'0')} 号位 · ${LEVEL_NAMES[p.level]}</div>
    <div class="card-note">${p.note ? '“' + escapeHtml(p.note) + '”' : '（无备注）'}</div>
  `;
  cardEl.classList.add('show');

  const oldCloseBtn = cardEl.querySelector('#cardClose');
  if (oldCloseBtn) oldCloseBtn.replaceWith(oldCloseBtn.cloneNode(true));
  document.getElementById('cardClose').addEventListener('click', (e) => {
    e.stopPropagation();
    if (preFocusView) {
      // 使用飞行动画返回到聚焦前的视图
      const startTarget = controls.target.clone();
      const startDist = camera.position.distanceTo(startTarget);
      const targetPos = preFocusView.target.clone();
      const endDist = preFocusView.dist;
      
      flyTween = {
        t: 0, dur: 800,
        p0: camera.position.clone(),
        p1: targetPos.clone(),
        t0: startTarget.clone(),
        t1: targetPos.clone(),
        dist0: startDist,
        dist1: endDist,
        onComplete: () => {
          flyTween = null;
          preFocusView = null;
          deselect();
          if (!modeTransition) controls.enabled = true;
        }
      };
      controls.enabled = false;
    } else {
      deselect();
    }
  });

  applyHighlight(p);
  updateAllLabelLayouts();

  if (innerWidth <= 820) setPanelCollapsed(true);

  if (!fly) return;

  if (is2DMode) {
    const hitbox = passengerHitboxes[i];
    const worldPos = new THREE.Vector3();
    hitbox.getWorldPosition(worldPos);

    const D = camera.position.x - controls.target.x;

    focusTween2D = {
      t: 0, dur: 800,
      startTarget: controls.target.clone(),
      endTarget: worldPos.clone(),
      D,
      onComplete: () => {
        focusTween2D = null;
        controls.enabled = true;
        focusState = {
          target: controls.target.clone(),
          dist: camera.position.distanceTo(controls.target)
        };
      }
    };
    controls.enabled = false;
  } else {
    const worldPos = getPassenger3DWorldPos(p);
    const targetPos = worldPos.clone().sub(new THREE.Vector3(0, 0.25, 0));

    const carIdx = CAR_NUMBERS.indexOf(p.car);
    const compIndex = Math.floor((p.num - 1) / 6);
    const inCompNum = (p.num - 1) % 6 + 1;
    const isLeft = (inCompNum % 2 !== 0);
    const compZ = -CAR_LEN / 2 + compIndex * COMP_LEN + COMP_LEN / 2 + CAR_CENTERS[carIdx];

    const camPos = new THREE.Vector3(
      targetPos.x + 4.2,
      targetPos.y + 2.8,
      compZ + (isLeft ? 1.4 : -1.4)
    );

    flyTo(targetPos, camPos, 1100);
  }
}

function deselect() {
  selected = -1;
  focusState = null;

  /* 取消进行中的飞行动画与 2D 聚焦动画，避免相机停在半路且 controls 被锁死 */
  flyTween = null;
  focusTween2D = null;
  if (!modeTransition) controls.enabled = true;

  cardEl.classList.remove('show');
  [...listEl.children].forEach(el => el.classList.remove('active'));
  clearHighlight();
  updateAllLabelLayouts();
}

/* =========================================================
   14. 3D 飞行
   ========================================================= */
function flyTo(targetPos, camPos, dur = 1100) {
  if (controls.enabled) controls.enabled = false;
  flyTween = {
    t: 0, dur,
    p0: camera.position.clone(),
    p1: camPos.clone(),
    t0: controls.target.clone(),
    t1: targetPos.clone(),
    onComplete: () => {
      if (!modeTransition && !is2DMode) controls.enabled = true;
      flyTween = null;
      if (selected >= 0) {
        focusState = {
          target: controls.target.clone(),
          dist: camera.position.distanceTo(controls.target)
        };
      }
    }
  };
}

function updateFlyTween(dt) {
  if (!flyTween) return;
  flyTween.t += dt * 1000;
  let k = Math.min(flyTween.t / flyTween.dur, 1);
  k = easeInOutCubic(k);

  camera.position.lerpVectors(flyTween.p0, flyTween.p1, k);
  controls.target.lerpVectors(flyTween.t0, flyTween.t1, k);
  
  // 插值相机距离（如果存在）
  if (typeof flyTween.dist0 === 'number' && typeof flyTween.dist1 === 'number') {
    const newDist = THREE.MathUtils.lerp(flyTween.dist0, flyTween.dist1, k);
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, newDist);
  }
  
  camera.lookAt(controls.target);

  if (flyTween.t >= flyTween.dur) {
    const cb = flyTween.onComplete;
    if (cb) cb();
  }
}

controls.addEventListener('change', () => {
  if (selected < 0 || !focusState) return;
  if (modeTransition || flyTween || focusTween2D) return;

  const dist = camera.position.distanceTo(controls.target);
  const targetDelta = controls.target.distanceTo(focusState.target);
  const distDelta = Math.abs(dist - focusState.dist);

  if (targetDelta > 0.12 || distDelta > focusState.dist * 0.06) {
    deselect();
  }
});

/* =========================================================
   15. 交互 & 列表
   ========================================================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);

renderer.domElement.addEventListener('pointermove', (e) => {
  if (modeTransition) return;
  if (e.pointerType === 'touch') return;

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const targets = is2DMode ? clickTargets2D : hitboxMeshes;
  const hits = raycaster.intersectObjects(targets, false);

  if (hits.length) {
    hovered = hits[0].object.userData.index;
    renderer.domElement.style.cursor = 'pointer';
  } else {
    hovered = -1;
    renderer.domElement.style.cursor = 'grab';
  }
});

let pointerDownPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (modeTransition) return;
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  pointerDownPos = null;
  if (Math.hypot(dx, dy) > 8) return;

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const targets = is2DMode ? clickTargets2D : hitboxMeshes;
  const hits = raycaster.intersectObjects(targets, false);

  if (hits.length) {
    selectPassenger(hits[0].object.userData.index, true);
  } else {
    deselect();
  }
});

PASSENGERS.forEach((p, i) => {
  const item = document.createElement('button');
  item.className = 'list-item';
  item.innerHTML = `
    <span class="indicator" style="background:${p.color}; box-shadow:0 0 8px ${p.color}"></span>
    <span class="nm">${escapeHtml(p.shortName)}</span>
    <span class="ps">${p.car}车 ${String(p.num).padStart(2,'0')}号 ${LEVEL_NAMES[p.level]}</span>
  `;
  item.addEventListener('click', () => selectPassenger(i, true));
  item.addEventListener('pointerenter', () => { hovered = i; });
  item.addEventListener('pointerleave', () => { if (hovered === i) hovered = -1; });
  listEl.appendChild(item);
});

/* =========================================================
   16. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let elapsed = 0;
let firstFrame = true;
let envOpacity = 1;
let loadHideScheduled = false;

function hideLoading() {
  if (!loadingEl.classList.contains('hidden')) loadingEl.classList.add('hidden');
}

function tryHideLoadingWhenProgressDone() {
  if (loadHideScheduled) return;
  if (loadTargetPct >= 100 && loadDisplayPct >= 99.9) {
    loadHideScheduled = true;
    setTimeout(hideLoading, 220);
  } else {
    requestAnimationFrame(tryHideLoadingWhenProgressDone);
  }
}

function updateModeTransition(dt) {
  modeTransition.t += dt * 1000;
  const tNorm = Math.min(modeTransition.t / modeTransition.dur, 1);

  const k = easeInOutQuart(tNorm);

  controls.target.lerpVectors(modeTransition.startTarget, modeTransition.endTarget, k);

  const quat = modeTransition.startQuat.clone().slerp(modeTransition.endQuat, k);
  const dir = REF_AXIS.clone().applyQuaternion(quat);

  const dist = modeTransition.startDist + (modeTransition.endDist - modeTransition.startDist) * k;

  camera.position.copy(controls.target).addScaledVector(dir, dist);

  const fovK = easeInOutCubic(tNorm);
  camera.fov = THREE.MathUtils.lerp(modeTransition.startFov, modeTransition.endFov, fovK);
  camera.updateProjectionMatrix();

  carGroups.forEach((g, i) => {
    g.position.lerpVectors(modeTransition.startCarPositions[i], modeTransition.endCarPositions[i], k);
  });

  matAisleWall.opacity = THREE.MathUtils.lerp(modeTransition.startAisleOpacity, modeTransition.endAisleOpacity, k);
  scene.fog.density = THREE.MathUtils.lerp(modeTransition.startFogDensity, modeTransition.endFogDensity, k);

  const lineOp = modeTransition.to2D ? k : (1 - k);
  mat2DFrame.opacity = 0.55 * lineOp;
  twoDLineGroup.visible = lineOp > 0.001;

  /* ---- 过渡中同步插值标签 Y 位置与引线透明度，消除切换瞬间跳变 ---- */
  const isTo2D = modeTransition.to2D;
  PASSENGERS.forEach((_, i) => {
    const e = labelEntries[i];
    if (!e) return;
    const y3D = e.basePos.y + e.lift3D;
    const y2D = e.levelY + 0.05;
    const ty = isTo2D ? THREE.MathUtils.lerp(y3D, y2D, k) : THREE.MathUtils.lerp(y2D, y3D, k);
    e.label.position.set(e.basePos.x, ty, e.basePos.z);

    const lineAlpha = isTo2D ? (1 - k) : k;
    e.lineMat.opacity = 0.35 * lineAlpha;
    e.line.visible = lineAlpha > 0.01;
  });

  const show2D = modeTransition.to2D ? (tNorm >= 0.5) : (tNorm < 0.5);
  if (show2D !== lastBunk2DVisible) {
    lastBunk2DVisible = show2D;
    bunk2DMeshes.forEach(o => o.visible = show2D);
  }

  if (!modeTransition.swapped && tNorm >= 0.5) {
    modeTransition.swapped = true;
    setSolidMeshesVisible(!modeTransition.to2D);
  }

  camera.lookAt(controls.target);

  if (modeTransition.t >= modeTransition.dur) {
    const cb = modeTransition.onComplete;
    modeTransition = null;
    if (cb) cb();
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (modeTransition) {
    updateModeTransition(dt);
  }

  if (!modeTransition && flyTween) updateFlyTween(dt);

  // 持续应用自适应缩放速度（覆盖滚轮、中键拖动、触摸捏合）
  if (controls.enabled && controls.enableZoom) {
    applyAdaptiveZoomSpeed(1);
  }

  if (!modeTransition && focusTween2D) {
    focusTween2D.t += dt * 1000;
    const k = easeInOutCubic(Math.min(focusTween2D.t / focusTween2D.dur, 1));
    controls.target.lerpVectors(focusTween2D.startTarget, focusTween2D.endTarget, k);
    camera.position.set(
      controls.target.x + focusTween2D.D,
      controls.target.y,
      controls.target.z
    );
    camera.lookAt(controls.target);

    if (focusTween2D.t >= focusTween2D.dur) focusTween2D.onComplete();
  }

  for (const m of markers) {
    if (m.type === 'label') {
      const isActive = (m.data === PASSENGERS[selected] || m.data === PASSENGERS[hovered]);
      m.mesh.element.classList.toggle('is-active', isActive);
    }
  }

  if (!is2DMode && !modeTransition) {
    const focused = selected >= 0;
    const targetEnv = focused ? 0.1 : 1;
    envOpacity += (targetEnv - envOpacity) * 0.1;

    envMaterials.forEach(mat => {
      if (mat === matAisleWall) {
        mat.opacity += ((focused ? 0.04 : 0.22) - mat.opacity) * 0.1;
      } else {
        mat.opacity = envOpacity;
      }
    });

    allBunks.forEach(bunk => {
      const isTarget = focused && bunk === passengerBunkMap.get(PASSENGERS[selected]);
      const targetOp = focused ? (isTarget ? 1 : 0.05) : 1;
      bunk.userData.materials.forEach(mat => {
        mat.opacity += (targetOp - mat.opacity) * 0.1;
      });
    });
  }

  if (highlightedBunk && !modeTransition) {
    /* 柔和脉冲：使用缓动的三角波，而非机械正弦波 */
    const t = (elapsed * 1.6) % 2;
    const pulse = t < 1 ? t : 2 - t;
    highlightedBunk.userData.materials.forEach(m => {
      if (m.emissive) m.emissiveIntensity = 0.25 + pulse * 0.35;
    });
  }

  if (controls.enabled && !modeTransition && !focusTween2D && !flyTween) {
    controls.update();
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    tryHideLoadingWhenProgressDone();
  }
}

bunk2DMeshes.forEach(o => o.visible = false);
lastBunk2DVisible = false;
updateAllLabelLayouts();

setLoadProgress(93, '正在准备渲染场景…');
await nextFrame();

animate();
setLoadProgress(100, '加载完成');

/* =========================================================
   17. 窗口尺寸
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);

  if (modeTransition) {
    refreshTransitionEndOrbit();
  } else if (is2DMode) {
    const D = compute2DDistance(innerWidth / innerHeight);
    const currentD = camera.position.x - controls.target.x;
    if (currentD < D * 0.98) {
      camera.position.set(controls.target.x + D, controls.target.y, controls.target.z);
      controls.minDistance = Math.max(D * 0.4, 5);
      controls.maxDistance = D * 5;
      controls.update();
      if (focusState) focusState.dist = D;
    }
  }
});
</script>
</body>
